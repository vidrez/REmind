services:
  db:
    image: mysql:8.0
    container_name: remind_db
    restart: always
    env_file:
      - db.env
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-conf/my_custom.cnf:/etc/mysql/conf.d/my_custom.cnf
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  remind:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: remind_app
    restart: always
    volumes:
      - ./re-webui:/flask_website
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - app.env
      - db.env
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
