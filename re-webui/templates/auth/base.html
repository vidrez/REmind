<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Remind</title>
    <link href="{{url_for('static', filename='bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{url_for('static', filename='remind.css') }}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">REmind</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="mt-1" id="at-container"></div>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            {% if g.user %}
              <li class="nav-item">
                <span class="nav-link disabled text-light">User: {{ g.user['username'] }}</span>
              </li>
              <li class="nav-item">
                <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">Log Out</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('auth.login') }}">Log In</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="">
      {% for message in get_flashed_messages() %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}

      <section class="content">
        {% block content %}{% endblock %}
      </section>

    </div>

    <script src="{{url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    {% block scripts %}
    <script type="text/javascript" src="{{ url_for('static', filename='app.js') }}" defer></script>
    {% endblock %}
  </body>
</html>
