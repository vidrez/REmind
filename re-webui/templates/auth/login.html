{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4 p-md-5">
            <div>
                <div class="alert alert-primary alert-dismissible fade show" role="alert">
                    <small>First time here? Click <strong>Sign up</strong> to generate a token. Please <strong>save
                            it</strong> for future access.</small>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <!-- Header with Icon -->
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                        style="width: 60px; height: 60px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                            class="bi bi-shield-lock" viewBox="0 0 16 16">
                            <path
                                d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.061.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.775 11.775 0 0 1-2.517 2.453 7.159 7.159 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7.158 7.158 0 0 1-1.048-.625 11.777 11.777 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 62.456 62.456 0 0 1 5.072.56z" />
                            <path
                                d="M9.5 6.5a1.5 1.5 0 0 1-1 1.415l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99a1.5 1.5 0 1 1 2-1.415z" />
                        </svg>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-body-secondary mb-0">Enter your access token to continue</p>
                </div>

                <form method="POST" action="/auth/login">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="token" name="token" placeholder="Token" required
                            style="border-radius: 0.5rem;">
                        <label for="token">Access Token</label>
                    </div>

                    <div class="d-flex align-items-center justify-content-center">
                        <input type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm w-100"
                            value="Sign in">
                        <button id="signup"
                            class="d-none ms-2 btn btn-success btn-lg rounded-pill fw-semibold shadow-sm w-100"
                            onclick="generateToken()">Sign up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}

    {% block scripts %}
    <script type="text/javascript" src="{{ url_for('static', filename='login.js') }}" defer></script>
    {% endblock %}
