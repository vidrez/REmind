{% extends 'base.html' %}

{% block title %}Submit Solution{% endblock %}

{% block content %}
<link href="{{url_for('static', filename='remind.css') }}" rel="stylesheet" />

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <!-- Main Card -->
      <div class="card shadow-sm border-0 rounded-3">

        <!-- Card Header -->
        <div class="card-header bg-body-tertiary border-bottom-0 pt-4 pb-0 text-center">
          <h1 class="h3 fw-bold text-primary">Did you find the solution?</h1>
          <p class="text-muted">Document your steps below to complete the challenge.</p>
        </div>

        <div class="card-body p-4">
          <form method="post" action="{{ url_for('rev_webui.index') }}">

            <div class="mb-4">
              <label for="solution" class="form-label fw-semibold">
                Write here the steps to get the 'Success!' string:
              </label>
              <textarea class="form-control" name="solution" id="solution" rows="10"
                placeholder="Describe your solution steps or paste the command line arguments here..."
                required></textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-between align-items-center">
              <!-- Secondary Actions -->
              <div class="btn-group" role="group">
                <a href="{{ url_for('first_chall.first_chall') }}" class="btn btn-outline-secondary">
                   Back to Challenge
                </a>
                <a href="{{ url_for('rev_webui.index') }}" class="btn btn-outline-secondary">
                  Submit Later
                </a>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                Submit Solution
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
