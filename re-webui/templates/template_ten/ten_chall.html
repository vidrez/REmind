{% if session['obfuscation_10'] %}
<script>
function obfuscate(id) {
   for (var index in spanIds) {
        $('span#' + spanIds[index] + '.token.generic').css('filter', 'blur(8px)')
   }
    localStorage.setItem("addr", id)
    $("code#" + id + " span.token.generic").css("filter", "");
    $('.token.generic').css("background", "");
    spanIds = [];
    if (previousBBid != 0 && previousBBid != id) {
        $("code#" + previousBBid +" span.token.generic").css("filter", "blur(8px)");
    }
    previousBBid = id;
}
</script>
{% else %}
<script>
function obfuscate(id) {
    localStorage.setItem("addr", id)
    $("code#" + id + " span.token.generic").css("filter", "");
    $('.token.generic').css("background", "");
    previousBBid = id;
}
</script>
{% endif %}

<style>
/* --- identical CSS (unchanged) --- */
#output { margin-left:10px; margin-right:10px; position:relative; top:600px; }
.notes, .py {
  display:none; float:right; height:100%; width:350px; position:fixed; z-index:0;

  font-size:24px; font-family:Consolas, Monaco, monospace;
}
.notes { top:100px; right:0; }
.py { top:80px; right:0; }
textarea{ background-color:black; color:white; }
button {
    font-family:Consolas, Monaco, monospace; background:red; border:0; width:150px;
    height:40px; border-radius:3px; color:yellow; cursor:pointer;
    transition:background 0.3s ease-in-out;
}
.cfgbutton {
    background-color:transparent;
    background:url("{{url_for('static', filename='./gear.png')}}") no-repeat;
    border:none; cursor:pointer; height:50px; padding-left:50px;
}
.dropdown { position:relative; display:inline-block; }
.dropdown-content {
  display:none; position:absolute; right:0; background-color:#f9f9f9;
  min-width:160px; box-shadow:0px 8px 16px rgba(0,0,0,0.2); z-index:1;
}
.dropdown-content a {
  color:black; padding:12px 16px; text-decoration:none; display:block;
}
.dropdown-content a:hover {background-color:#414141; color:white;}
.dropdown:hover .dropdown-content {display:block;}
</style>

<body>

<div class="py">

<div class="notes">

    <textarea id="notes_area" cols="40" rows="42"></textarea><br />

  </form>
</div>

<div class="mainw">
    <br/>

        <svg></svg>
    </div>
</div>

<script id="js">

localStorage.setItem("lastChallId", "ten_chall");

function storeit() {
    var note = document.getElementById("notes_area").value;
    $.post(base_url + "/ten_chall/storeNotes",
           data={'token':id, 'notes':note})
    alert("Your notes have been saved!")
}

var id = '{{ session["tmp_token"] }}';
var addr_to_zoom = '{{ session["addr"] }}';
var func_to_download = '{{ session["function_name"] }}';

downloadCFG(func_to_download);

function change_page() {
    if (relocate == 1) {
        relocate = 0
        coord = pop_function_history()
        if (coord == null) return
        foo = coord[0]
        addr = coord[1]
        let new_url = base_url + "/ten_chall/?function=" + foo;
        if (addr != null)
            new_url += "&&addr=" + addr;
        window.location.href = new_url;
    }
}
</script>
